server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ahrao-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:academic_hostel_resource_allocation}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:54400171}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: -1

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

ahrao:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:${JWT_EXPIRATION:86400000}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173,http://localhost:3000}}
  ai:
    service-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:8000}
    min-training-records: ${AI_MIN_TRAINING_RECORDS:5}
  demo:
    vsb:
      data-dir: ${VSB_DEMO_DATA_DIR:C:/Users/KAVIRAJ/Downloads/AHRAO_VSB_College_Demo_Data}
      auto-import: ${VSB_DEMO_AUTO_IMPORT:false}

logging:
  level:
    root: INFO
    com.ahrao: DEBUG
    org.springframework.security: INFO
